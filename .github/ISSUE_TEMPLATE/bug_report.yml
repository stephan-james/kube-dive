name: Bug Report
description: Create a report to help us improve Kube Dive
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open VS Code with Kube Dive installed
        2. Click on Cluster '...'
        3. Click on Namespace '...'
        4. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, VS Code version, and kubectl version.
      placeholder: macOS 14.5 / VS Code 1.90 / kubectl v1.30.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Screenshots
      description: Please copy and paste any relevant logs or error dialogs.
