name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      publish_vsce:
        description: 'Publish to VS Code Marketplace'
        required: true
        type: boolean
        default: false
      publish_ovsx:
        description: 'Publish to Open VSX Registry'
        required: true
        type: boolean
        default: false
      create_github_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true

jobs:
  build-and-publish:
    name: Package & Publish Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Quality Checks & Tests
        run: |
          npm run code:format:check
          npm run code:lint
          npm run test:coverage

      - name: Package VSIX
        run: npx @vscode/vsce package --out kube-dive.vsix

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: ${{ inputs.create_github_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          files: kube-dive.vsix
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: ${{ inputs.publish_vsce }}
        run: npx @vscode/vsce publish --packagePath kube-dive.vsix -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        if: ${{ inputs.publish_ovsx }}
        run: npx ovsx publish kube-dive.vsix -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
